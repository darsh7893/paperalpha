name: bot-cycle
# Runs the AI bots every 15 minutes by pinging the live app.
# Needs two repo secrets (Settings -> Secrets and variables -> Actions):
#   APP_URL     e.g. https://paperalpha.onrender.com
#   CRON_SECRET copied from the Render dashboard (Environment tab)
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ -z "${{ secrets.APP_URL }}" ]; then
            echo "APP_URL secret not set yet — skipping. Set APP_URL + CRON_SECRET in repo Settings > Secrets and variables > Actions to enable bot cycles."
            exit 0
          fi
          code=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X POST "${{ secrets.APP_URL }}/api/run_bots" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 120)
          cat /tmp/resp.txt; echo
          if [ "$code" = "000" ]; then
            echo "App not reachable yet (Render deploy may still be running) — skipping without failing."
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "Unexpected HTTP $code from app"; exit 1
          fi
